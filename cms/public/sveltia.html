<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c0c12" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CMS Admin" />
    <meta name="format-detection" content="telephone=no" />
    <title>Chaos Studio CMS</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="cms-config-url" type="text/yaml" href="/config.yml" />
    <link rel="stylesheet" href="/cms-portal.css" />
    <script>
      (function() {
        const returnUrl = sessionStorage.getItem('cmsReturnUrl');
        if (returnUrl) {
          const raw = localStorage.getItem('sveltia-cms.user') || localStorage.getItem('decap-cms-user');
          if (raw) {
            try {
              const user = JSON.parse(raw);
              if (user?.token) {
                sessionStorage.removeItem('cmsReturnUrl');
                window.location.href = returnUrl;
              }
            } catch (e) {}
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="/sveltia-cms.js"></script>
    <script src="/cms-hooks.js"></script>
    <script src="/cms-portal.js" defer></script>
  </body>
</html>
