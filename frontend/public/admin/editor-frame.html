<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CMS Editor</title>
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
    <link rel="stylesheet" href="/admin/editor-frame.css" />
    <script>
      (function () {
        var h = location.hash || "";
        if (!/\/entries\/[^/?#]+/.test(h)) {
          location.replace("/admin/#/");
        }
      })();
    </script>
  </head>

    <div id="nc-root"></div>
    <script src="/admin/decap-cms.js"></script>
    <script src="/admin/cms-hooks.js" defer></script>
