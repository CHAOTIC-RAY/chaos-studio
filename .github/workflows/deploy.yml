name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Prepare Cloudflare credentials
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo secrets."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "Token length: ${#TOKEN} chars · Account ID length: ${#ACCOUNT} chars"

      - name: Verify Cloudflare API token
        run: |
          RESP=$(curl -sS -w "\n%{http_code}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "$BODY"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Token verify failed (HTTP $HTTP). Check CLOUDFLARE_API_TOKEN has no extra spaces."
            exit 1
          fi
          echo "$BODY" | grep -q '"status":"active"' || {
            echo "::error::API token is not active."
            exit 1
          }
          echo "API token is active."

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.93.0"
        env:
          WRANGLER_SKIP_BUILD: "1"

      - name: Deploy CMS GitHub OAuth worker
        working-directory: cms-proxy
        run: |
          if [ -n "$CMS_OAUTH_CLIENT_ID" ] && [ -n "$CMS_OAUTH_CLIENT_SECRET" ]; then
            printf '%s' "$CMS_OAUTH_CLIENT_ID" | npx wrangler@4.93.0 secret put GITHUB_OAUTH_ID
            printf '%s' "$CMS_OAUTH_CLIENT_SECRET" | npx wrangler@4.93.0 secret put GITHUB_OAUTH_SECRET
          else
            echo "::warning::CMS_OAUTH_CLIENT_ID or CMS_OAUTH_CLIENT_SECRET not set — cms-auth deploys but GitHub login will fail until both are added. See cms-proxy/README.md"
          fi
          npx wrangler@4.93.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_OAUTH_CLIENT_ID: ${{ secrets.CMS_OAUTH_CLIENT_ID }}
          CMS_OAUTH_CLIENT_SECRET: ${{ secrets.CMS_OAUTH_CLIENT_SECRET }}
