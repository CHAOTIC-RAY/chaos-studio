name: CMS sync guard

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "cms/**"
      - "frontend/public/**"
      - "scripts/verify-cms-sync.mjs"
      - "scripts/build-cms.mjs"
  pull_request:
    paths:
      - "content/**"
      - "cms/**"
      - "frontend/public/**"
      - "scripts/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Build CMS + verify mirrors
        run: |
          set -x
          echo "::group::Starting CMS build and sync verification"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "::endgroup::"
          
          echo "::group::Step 1: Build CMS"
          npm run build:cms || { echo "::error::CMS build failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 2: Verify CMS sync (dist)"
          npm run verify:cms-sync -- --dist || { echo "::error::CMS sync verification failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::notice::CMS build and sync verification completed successfully"
