<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ibrahim Wafig — graphic designer. Brand identity, campaigns, and product design. ChaosStudio.mv"
    />
    <title>Ibrahim Wafig · Graphic Design Portfolio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var k = "portfolio-theme";
        var t;
        try {
          t = localStorage.getItem(k);
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "light";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="app" class="loading-screen">Loading portfolio…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
