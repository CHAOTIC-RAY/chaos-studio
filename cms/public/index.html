<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c0c12" />
    <meta name="color-scheme" content="dark" />
    <title>Chaos Studio Admin Portal</title>
    <style>
      body {
        background: #0c0c12;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      h1 {
        margin-bottom: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .modes {
        display: flex;
        gap: 1.5rem;
      }
      .mode-card {
        background: #1a1a24;
        border: 1px solid #2a2a36;
        border-radius: 12px;
        padding: 2rem;
        width: 280px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        color: inherit;
      }
      .mode-card:hover {
        background: #232330;
        border-color: #3b82f6;
        transform: translateY(-2px);
      }
      .mode-icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      .mode-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .mode-desc {
        font-size: 0.875rem;
        color: #9ca3af;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Select CMS Mode</h1>
    <div class="modes">
      <a href="visual-editor.html" class="mode-card">
        <div class="mode-icon">✨</div>
        <div class="mode-title">Visual Editor</div>
        <div class="mode-desc">Edit your site directly on the live mockup. Changes are pushed directly to Github.</div>
      </a>
      <a href="sveltia.html" class="mode-card">
        <div class="mode-icon">⚙️</div>
        <div class="mode-title">Sveltia CMS</div>
        <div class="mode-desc">Standard form-based content management. Advanced settings and configuration.</div>
      </a>
    </div>
  </body>
</html>
