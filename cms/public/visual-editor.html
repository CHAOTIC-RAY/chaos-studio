<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Editor | Chaos Studio</title>
    <style>
      body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background: #0c0c12; color: white; overflow: hidden; }
      #topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; height: 48px; background: #1a1a24; border-bottom: 1px solid #2a2a36; }
      .brand { font-weight: 600; }
      .controls { display: flex; gap: 1rem; align-items: center; }
      button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-weight: 500; }
      button:hover { background: #2563eb; }
      button:disabled { background: #4b5563; cursor: not-allowed; }
      #iframe-container { height: calc(100vh - 48px); width: 100%; position: relative; }
      iframe { width: 100%; height: 100%; border: none; }
      #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 10; flex-direction: column; }
      .auth-box { background: #1a1a24; padding: 2rem; border-radius: 8px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="auth-box">
        <h2>Authentication Required</h2>
        <p>Please log in via Sveltia CMS first.</p>
        <button onclick="location.href='sveltia.html'">Go to Login</button>
      </div>
    </div>
    
    <div id="topbar">
      <div class="brand">Visual Editor Mode</div>
      <div class="controls">
        <span id="status">Loading site...</span>
        <button id="enable-edit">Enable Editing</button>
        <button id="publish" disabled>Publish Changes</button>
        <button onclick="location.href='index.html'" style="background: #4b5563;">Exit</button>
      </div>
    </div>

    <div id="iframe-container">
      <iframe id="preview" src="/"></iframe>
    </div>

    <script src="/visual-editor.js"></script>
  </body>
</html>
