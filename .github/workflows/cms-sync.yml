name: CMS sync guard

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "cms/**"
      - "frontend/public/**"
      - "scripts/verify-cms-sync.mjs"
      - "scripts/build-cms.mjs"
  pull_request:
    paths:
      - "content/**"
      - "cms/**"
      - "frontend/public/**"
      - "scripts/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Build CMS + verify mirrors
        run: npm run build:cms && npm run verify:cms-sync -- --dist
