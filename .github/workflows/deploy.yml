name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [cms-publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Prepare Cloudflare credentials
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo secrets."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "Token length: ${#TOKEN} chars · Account ID length: ${#ACCOUNT} chars"

      - name: Verify Cloudflare API token
        run: |
          RESP=$(curl -sS -w "\n%{http_code}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          HTTP=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "$BODY"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Token verify failed (HTTP $HTTP). Check CLOUDFLARE_API_TOKEN has no extra spaces."
            exit 1
          fi
          echo "$BODY" | grep -q '"status":"active"' || {
            echo "::error::API token is not active."
            exit 1
          }
          echo "API token is active."

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (pano preview videos)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build site + CMS app
        run: |
          set -x
          echo "::group::Starting build process"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "::endgroup::"
          
          echo "::group::Step 1: Sync content"
          npm run sync:content || { echo "::error::Content sync failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 2: Verify CMS sync"
          node scripts/verify-cms-sync.mjs || { echo "::error::CMS sync verification failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 3: Validate CMS schema"
          node scripts/validate-cms-schema.mjs || { echo "::error::CMS schema validation failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 4: Check post image duplicates"
          node scripts/check-post-image-dupes.mjs || { echo "::error::Post image duplicate check failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 5: Generate icons"
          node scripts/generate-icons.mjs || { echo "::error::Icon generation failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 6: Generate panorama assets"
          npm run pano:assets || { echo "::error::Panorama asset generation failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 7: Build frontend"
          npm run build --workspace=frontend || { echo "::error::Frontend build failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 8: Copy SPA routes"
          node scripts/copy-spa-routes.mjs || { echo "::error::SPA routes copy failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 9: Build CMS"
          npm run build:cms || { echo "::error::CMS build failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::group::Step 10: Verify CMS sync (dist)"
          node scripts/verify-cms-sync.mjs --dist || { echo "::error::CMS sync verification (dist) failed"; exit 1; }
          echo "::endgroup::"
          
          echo "::notice::Build completed successfully"

      - name: Verify CMS build output
        run: |
          test -f cms/dist/decap-cms.js
          test -f cms/dist/config.yml
          test -f cms/dist/cms-app.css
          test -f cms/dist/cms-app.js
          test -f cms/dist/cms-hooks.js
          test -f cms/dist/editor-frame.html
          test -f cms/dist/cms-assistant.js
          test -f cms/dist/media-manifest.json
          test -f cms/dist/sync-status.json
          test -f frontend/dist/admin/index.html
          test -f frontend/dist/admin/decap-cms.js
          test -f frontend/dist/admin/config.yml

      - name: Deploy portfolio to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4.93.0"
        env:
          WRANGLER_SKIP_BUILD: "1"

      - name: Deploy CMS app to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cms/wrangler.jsonc
          wranglerVersion: "4.93.0"
        env:
          WRANGLER_SKIP_BUILD: "1"

      - name: Deploy CMS GitHub OAuth worker
        continue-on-error: true
        working-directory: cms-proxy
        run: |
          if [ -n "$CMS_OAUTH_CLIENT_ID" ] && [ -n "$CMS_OAUTH_CLIENT_SECRET" ]; then
            printf '%s' "$CMS_OAUTH_CLIENT_ID" | npx wrangler@4.93.0 secret put GITHUB_OAUTH_ID
            printf '%s' "$CMS_OAUTH_CLIENT_SECRET" | npx wrangler@4.93.0 secret put GITHUB_OAUTH_SECRET
          else
            echo "::warning::CMS_OAUTH_CLIENT_ID or CMS_OAUTH_CLIENT_SECRET not set — cms-auth deploys but GitHub login will fail until both are added. See cms-proxy/README.md"
          fi
          npx wrangler@4.93.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_OAUTH_CLIENT_ID: ${{ secrets.CMS_OAUTH_CLIENT_ID }}
          CMS_OAUTH_CLIENT_SECRET: ${{ secrets.CMS_OAUTH_CLIENT_SECRET }}
