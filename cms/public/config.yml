# Decap CMS — git-based editor (Decap / Netlify CMS)
# https://cms.chaoticstudio.workers.dev/
# Setup guide: content/CMS-SETUP.md

backend:
  name: github
  repo: CHAOTIC-RAY/portfolio
  branch: main
  # Self-hosted OAuth (Netlify bridge only works for Netlify-hosted sites)
  base_url: https://cms-auth.chaoticstudio.workers.dev
  auth_endpoint: auth

site_url: https://portfolio.chaoticstudio.workers.dev
display_url: https://portfolio.chaoticstudio.workers.dev
logo_url: https://portfolio.chaoticstudio.workers.dev/icons/icon-192.png

# Disable deploy preview (not supported on Cloudflare Workers)
show_preview_links: false

media_folder: frontend/public/images/posts
public_folder: /images/posts

publish_mode: simple

x-post-fields: &post-fields
  - { label: Post ID, name: id, widget: string, hint: "e.g. rainbow-01 — matches images/posts/{id}/" }
  - { label: Published, name: enabled, widget: boolean, default: true, required: false }
  - { label: Platform, name: platform, widget: string }
  - { label: Client, name: client, widget: string }
  - { label: Title, name: title, widget: string }
  - { label: Description, name: description, widget: text, required: false }
  - label: Tags
    name: tags
    widget: list
    hint: "Click + to add each tag (one per row)"
    collapsed: true
  - label: Accent
    name: accent
    widget: select
    options: ["purple", "pink", "gold", "teal"]
  - label: Layout
    name: cardLayout
    widget: select
    required: false
    options: ["default", "poster", "media-kit"]
    default: default
  - label: Media aspect
    name: mediaAspect
    widget: select
    required: false
    options: ["default", "square", "portrait", "landscape"]
    default: default
  - label: Slides
    name: slides
    widget: list
    required: false
    hint: "slide-01, slide-02, … (one basename per row)"
    collapsed: true
  - { label: Video filename, name: video, widget: string, required: false }
  - { label: Poster filename, name: poster, widget: string, required: false }
  - { label: Image basename, name: image, widget: string, required: false }

collections:
  - name: campaign
    label: Portfolio posts
    editor:
      preview: false
    files:
      - name: campaign-meta
        label: Campaign heading
        file: content/campaign-meta.json
        fields:
          - { label: Section subtitle, name: subtitle, widget: string, hint: "Short line under the Campaign heading on the home page" }
      - name: social-posts
        label: Portfolio feed (home page)
        file: content/social-posts.json
        editor:
          preview: false
        fields:
          - label: Social & campaign posts
            name: posts
            widget: list
            label_singular: Post
            summary: "{{fields.client}} — {{fields.title}}"
            collapsed: true
            minimize_collapsed: true
            allow_add: true
            allow_remove: true
            hint: "Cards in the Campaign section on the main portfolio home page."
            fields: *post-fields
      - name: gallery-posts
        label: Gallery pano tiles
        file: content/gallery-posts.json
        editor:
          preview: false
        fields:
          - label: Gallery posts & images
            name: posts
            widget: list
            label_singular: Gallery item
            summary: "{{fields.client}} — {{fields.title}}"
            collapsed: true
            minimize_collapsed: true
            allow_add: true
            allow_remove: true
            hint: "Reels, media kits, posters, and multi-slide work in the /gallery panoramic view."
            fields: *post-fields

  - name: portfolio
    label: Site content
    editor:
      preview: false
    files:
      - name: main
        label: Home page
        file: content/portfolio.json
        fields:
          - label: Profile
            name: profile
            widget: object
            collapsed: true
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Tagline, name: tagline, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Portfolio URL, name: portfolioUrl, widget: string }
              - { label: Logo alt text, name: logoAlt, widget: string, required: false }
          - label: Objective
            name: objective
            widget: object
            collapsed: true
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
          - label: Soft skills
            name: softSkills
            widget: list
            hint: "One skill per row"
          - label: Interests
            name: interests
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Emoji, name: emoji, widget: string }
          - label: Experience
            name: experience
            widget: object
            collapsed: true
            fields:
              - { label: Subtitle, name: subtitle, widget: string }
              - label: Jobs
                name: items
                widget: list
                summary: "{{fields.company}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Company, name: company, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Period, name: period, widget: string }
                  - { label: Description, name: description, widget: text, required: false }
                  - label: Bullets
                    name: bullets
                    widget: list
                    hint: "One bullet per row"
                    collapsed: true
                  - { label: Logo initials, name: logo, widget: string }
                  - { label: Featured, name: featured, widget: boolean, required: false }
          - label: Featured work
            name: featuredWork
            widget: object
            collapsed: true
            fields:
              - { label: Subtitle, name: subtitle, widget: string }
              - label: Projects
                name: projects
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Tagline, name: tagline, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Link, name: href, widget: string }
                  - { label: CTA label, name: cta, widget: string }
                  - label: Highlights
                    name: highlights
                    widget: list
                    hint: "One line per row"
                    collapsed: true
                  - label: Tags
                    name: tags
                    widget: list
                    hint: "One tag per row"
                    collapsed: true
                  - label: Accent
                    name: accent
                    widget: select
                    options: ["pink", "neutral", "green"]
          - label: Skills
            name: skills
            widget: object
            collapsed: true
            fields:
              - { label: Subtitle, name: subtitle, widget: string }
              - label: Categories
                name: categories
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: string, required: false }
                  - label: Tools
                    name: tools
                    widget: list
                    hint: "One tool per row"
                    collapsed: true
                  - label: Style
                    name: variant
                    widget: select
                    options: ["primary", "muted"]
          - label: Education
            name: education
            widget: list
            fields:
              - { label: Degree, name: degree, widget: string }
              - { label: School, name: school, widget: string }
              - { label: Detail, name: detail, widget: string, required: false }
              - { label: Period, name: period, widget: string }
          - label: Contact
            name: contact
            widget: object
            collapsed: true
            fields:
              - { label: Email, name: email, widget: string }
              - { label: Phone, name: phone, widget: string }
              - { label: Instagram, name: instagram, widget: string }
              - { label: Instagram URL, name: instagramUrl, widget: string }
              - { label: Telegram, name: telegram, widget: string }
              - { label: Telegram URL, name: telegramUrl, widget: string }
              - { label: WhatsApp URL, name: whatsappUrl, widget: string }
          - label: Hero section
            name: hero
            widget: object
            collapsed: true
            fields:
              - { label: Headline, name: headline, widget: string, required: false }
              - { label: Subheadline, name: subheadline, widget: text, required: false }
              - { label: CTA text, name: ctaText, widget: string, required: false }
              - { label: Secondary CTA text, name: secondaryCta, widget: string, required: false }
          - label: Section toggles
            name: sections
            widget: object
            collapsed: true
            fields:
              - { label: Show statistics, name: showStats, widget: boolean, default: false }
              - { label: Show awards, name: showAwards, widget: boolean, default: false }
              - { label: Show news, name: showNews, widget: boolean, default: false }
              - { label: News items to show, name: newsCount, widget: number, default: 3, required: false }
          - label: Client logo wall
            name: clientLogoWall
            widget: object
            collapsed: true
            fields:
              - { label: Show client logos, name: enabled, widget: boolean, default: false }
              - { label: Section subtitle, name: subtitle, widget: string, required: false }
              - label: Client logos
                name: logos
                widget: list
                label_singular: Client logo
                summary: "{{fields.name}}"
                fields:
                  - { label: Client name, name: name, widget: string }
                  - { label: Logo path, name: logo, widget: string }
                  - { label: Alt text, name: alt, widget: string }
                  - { label: Website link, name: link, widget: string, required: false }
      - name: gallery
        label: Gallery page
        file: content/gallery.json
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Headline, name: headline, widget: string }
          - { label: Pitch, name: pitch, widget: text }
      - name: portfolio-stats
        label: Portfolio statistics
        file: content/portfolio-stats.json
        fields:
          - { label: Section subtitle, name: subtitle, widget: string }
          - label: Statistics
            name: stats
            widget: list
            label_singular: Stat
            summary: "{{fields.label}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
              - { label: Icon name, name: icon, widget: string, required: false }
      - name: portfolio-awards
        label: Awards & recognition
        file: content/portfolio-awards.json
        fields:
          - { label: Section subtitle, name: subtitle, widget: string }
          - label: Awards
            name: awards
            widget: list
            label_singular: Award
            summary: "{{fields.title}} ({{fields.year}})"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Award title, name: title, widget: string }
              - { label: Organization, name: organization, widget: string }
              - { label: Year, name: year, widget: string }
              - { label: Description, name: description, widget: text, required: false }
      - name: portfolio-news
        label: News & updates
        file: content/portfolio-news.json
        fields:
          - { label: Section subtitle, name: subtitle, widget: string }
          - label: News items
            name: news
            widget: list
            label_singular: News item
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Category, name: category, widget: string }
              - { label: Excerpt, name: excerpt, widget: text }
              - { label: Content, name: content, widget: text, required: false }

  - name: chaos-studio
    label: Chaos Studio tab
    editor:
      preview: false
    files:
      - name: studio-page
        label: Studio page (/studio)
        file: content/chaos-studio.json
        fields:
          - { label: Studio name, name: title, widget: string, hint: "Header on Studio tab" }
          - { label: Short tagline, name: tagline, widget: string }
          - { label: Main headline, name: headline, widget: string }
          - { label: Pitch, name: pitch, widget: text }
          - { label: About paragraph, name: description, widget: text }
          - label: Highlight bullets
            name: highlights
            widget: list
            hint: "One line per row"
          - label: Services list
            name: services
            widget: list
            hint: "One service per row"
          - label: Pricing packages
            name: packages
            widget: list
            label_singular: Package
            summary: "{{fields.name}} — {{fields.price}} {{fields.currency}}"
            fields:
              - { label: Package ID, name: id, widget: string, hint: "e.g. starter (do not change after publish)" }
              - { label: Package name, name: name, widget: string }
              - { label: Tagline, name: tagline, widget: text }
              - { label: Price, name: price, widget: string }
              - { label: Currency, name: currency, widget: string, default: "MVR" }
              - { label: Recommended badge, name: recommended, widget: boolean, required: false }
              - label: What's included
                name: features
                widget: list
                hint: "One feature per row"
                collapsed: true
          - { label: Pricing footnote, name: pricingNote, widget: text }
          - label: Why choose us
            name: whyUs
            widget: list
            label_singular: Reason
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
          - label: Studio statistics
            name: stats
            widget: object
            collapsed: true
            fields:
              - { label: Section subtitle, name: subtitle, widget: string }
              - label: Metrics
                name: metrics
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }
                  - { label: Description, name: description, widget: string, required: false }
          - label: Process steps
            name: process
            widget: list
            label_singular: Process step
            summary: "{{fields.step}}. {{fields.title}}"
            fields:
              - { label: Step number, name: step, widget: number }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Client testimonials
            name: testimonials
            widget: list
            label_singular: Testimonial
            summary: "{{fields.author}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Quote, name: quote, widget: text }
              - { label: Author name, name: author, widget: string }
              - { label: Title/position, name: title, widget: string }
              - { label: Contact number, name: contact, widget: string, required: false }
              - { label: Related package ID, name: packageId, widget: string, required: false }
          - label: Featured studio work
            name: featuredWork
            widget: list
            label_singular: Featured project
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Project title, name: title, widget: string }
              - { label: Category, name: category, widget: string }
              - { label: Cover image, name: image, widget: string }
              - { label: Results metric, name: results, widget: string, required: false }
              - { label: Link, name: link, widget: string }
          - label: Studio contact
            name: studioContact
            widget: object
            collapsed: false
            fields:
              - { label: Instagram handle, name: instagram, widget: string }
              - { label: Instagram link, name: instagramUrl, widget: string }
              - { label: Phone numbers, name: phones, widget: string }
              - { label: Email, name: email, widget: string }

  - name: site
    label: SEO & projects
    editor:
      preview: false
    files:
      - name: site-config
        label: Meta & work cards
        file: frontend/public/assets/site.config.json
        fields:
          - label: Brand assets
            name: brand
            widget: object
            collapsed: true
            fields:
              - { label: Logo path, name: logo, widget: string }
              - { label: Logo mark path, name: logoMark, widget: string }
              - { label: Logo alt, name: logoAlt, widget: string }
          - label: Meta (SEO)
            name: meta
            widget: object
            collapsed: true
            fields:
              - { label: Page title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: OG image path, name: ogImage, widget: string }
          - label: About
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: Portrait path, name: portrait, widget: string }
              - { label: Portrait alt, name: portraitAlt, widget: string }
              - { label: Bio, name: bio, widget: text }
              - label: Skill pills
                name: skills
                widget: list
                hint: "One skill per row"
          - label: Social links
            name: social
            widget: object
            collapsed: true
            fields:
              - { label: GitHub, name: github, widget: string }
              - { label: Behance, name: behance, widget: string }
              - { label: Dribbble, name: dribbble, widget: string }
              - { label: Instagram, name: instagram, widget: string }
          - label: Work cards
            name: work
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Slug, name: slug, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Category, name: category, widget: string }
              - { label: Year, name: year, widget: string }
              - { label: Cover path, name: cover, widget: string }
              - { label: Cover alt, name: coverAlt, widget: string }
              - { label: Link, name: href, widget: string }
              - { label: Featured, name: featured, widget: boolean, required: false }
          - label: Client logos
            name: clients
            widget: list
            summary: "{{fields.name}}"
            collapsed: true
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Logo path, name: logo, widget: string }
              - { label: Logo alt, name: logoAlt, widget: string }
